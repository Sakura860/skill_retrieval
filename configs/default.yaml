llm:
  provider: deepseek
  model: deepseek-v4-pro
  temperature: 0.0
  thinking: disabled          # enabled | disabled
  reasoning_effort: high      # high | max；仅 thinking=enabled 时发送

retrieval:
  method: multilevel          # bm25 | embedding | multilevel | model
  bm25_text_level: brief      # brief | detailed | all
  top_k: 5
  coarse_k: 20
  coarse_weight: 0.4
  embedding_model: all-MiniLM-L6-v2

organization:
  strategy: hierarchical     # flat | hierarchical | graph
  detail_top_k: 3

agent:
  framework: plan-and-execute
  planner_mode: one_stage      # one_stage | two_stage
  max_argument_repairs: 1      # 0 | 1；仅 two_stage 使用
  planner_disclosure_level: full  # brief | schema | full | adaptive | adaptive_signals
  max_steps: 10
  enable_reflection: true

evaluation:
  retrieval_ks: [1, 5, 10]
  metrics:
    retrieval:
      - recall@1
      - recall@5
      - recall@10
      - mrr
      - ndcg@1
      - ndcg@5
      - ndcg@10
    agent:
      - skill_selection_f1
      - sequence_accuracy
      - task_success_rate
    efficiency:
      - avg_skill_calls
      - redundant_call_rate
      - avg_skill_context_tokens
      - total_tokens
      - avg_execution_steps
      - avg_execution_time_ms
